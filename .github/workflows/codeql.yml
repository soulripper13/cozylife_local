name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "31 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@f051dc808ef3645eb0d08647ec751634ec2304ac # v3

      - name: Analyze
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v3