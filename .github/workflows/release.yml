name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-asset:
    name: Build HACS ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Validate release source
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version="$(jq -r '.version' custom_components/cozylife_local/manifest.json)"
          test "${tag}" != "${version}"
          test "${manifest_version}" = "${version}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Unsupported numeric release version: ${version}" >&2
            exit 1
          fi

      - name: Run regression tests
        run: python3 -m pytest -q

      - name: Compile integration
        run: python3 -m compileall -q custom_components/cozylife_local

      - name: Build HACS release ZIP
        run: |
          zip -r cozylife_local.zip custom_components/cozylife_local \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "*/.DS_Store"

      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: cozylife_local.zip
          prerelease: ${{ steps.version.outputs.prerelease }}