name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest pytest-timeout

      - name: Run regression tests
        run: python3 -m pytest -q --timeout=20

      - name: Compile integration
        run: python3 -m compileall -q custom_components/cozylife_local