name: Propose Model Catalog Update

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-model-catalog:
    name: Propose model.json update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          fetch-depth: 0

      - name: Fetch latest model catalog
        run: |
          set -euo pipefail
          curl -fsSL "https://api-us.doiting.com/api/v2/device_product/model?lang=en" \
            -o /tmp/model.json
          jq -e '.ret == "1" and .desc == "Success" and (.info.list | type == "array")' \
            /tmp/model.json >/dev/null
          jq -S . /tmp/model.json > custom_components/cozylife_local/model.json

      - name: Create or update model catalog pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update CozyLife model catalog
          title: Update CozyLife model catalog
          body: |
            Automated catalog refresh from the Cozy Life model endpoint.

            This pull request intentionally does not bump the integration version
            or create a release. Review the catalog change before merging and
            decide the release version separately.
          branch: automation/model-catalog
          delete-branch: true
          add-paths: custom_components/cozylife_local/model.json